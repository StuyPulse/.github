name: Reusable SystemCore Build

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Webhook URL for Slack"
        required: true

jobs:
  build:
    runs-on: ubuntu-24.04
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} SystemCore Build *${{ job.status }}* for `${{ github.repository }}` on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"