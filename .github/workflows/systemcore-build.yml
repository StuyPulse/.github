name: Reusable SystemCore Build

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Webhook URL for Slack"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: wpilib/systemcore-cross-ubuntu:2027-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.7.0
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build
      - name: Get last conclusion
        uses: actions/github-script@v7
        id: last-conclusion
        with:
          script: |
            const workflowFile = process.env.GITHUB_WORKFLOW_REF
              .split("/.github/workflows/")[1]
              .split("@")[0];

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              per_page: 5,
            });

            const previousRuns = data.workflow_runs.filter((run) => {
              return run.id !== context.runId;
            });

            if (previousRuns.length < 1) {
              core.setOutput("last-conclusion", "nada");
              return;
            }

            const lastConclusion = previousRuns[0].conclusion;
            core.setOutput("last-conclusion", lastConclusion);
            
      - name: Notify Slack
        if: failure() || (success() && steps.last-conclusion.outputs.last-conclusion == 'failure')
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} SystemCore Build *${{ job.status == 'failure' && 'failed' || 'recovered' }}* for `${{ github.repository }}` on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
