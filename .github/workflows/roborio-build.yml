name: Reusable RoboRIO Build

on:
  workflow_call:
    secrets:
      SLACK_WEBHOOK_URL:
        description: "Webhook URL for Slack"
        required: true

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container: wpilib/roborio-cross-ubuntu:2025-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Add repository to git safe directories
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile and run tests on robot code
        run: ./gradlew build

      - name: Get last conclusion
        uses: actions/github-script@v7
        id: last-conclusion
        with:
          script: |
            const workflowFile = process.env.GITHUB_WORKFLOW_REF
              .split("/.github/workflows/")[1]
              .split("@")[0];

            const branch = process.env.GITHUB_HEAD_REF || process.env.GITHUB_REF_NAME;

            console.log("Using workflow file: ", workflowFile);
            console.log("Using branch: ", branch);

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflowFile,
              branch,
              per_page: 5,
            });

            console.log("Workflow runs data fetch result: ", data);

            const previousRuns = data.workflow_runs.filter((run) => {
              return run.id !== context.runId;
            });

            console.log("Filtered workflow runs for previous runs: ", previousRuns);

            if (previousRuns.length < 1) {
              core.setOutput("last-conclusion", "nada");
              return;
            }

            const lastConclusion = previousRuns[0].conclusion;
            console.log("Last conclusion: ", lastConclusion);
            core.setOutput("last-conclusion", lastConclusion);

      - name: Notify Slack
        if: failure() || (success() && steps.last-conclusion.outputs.last-conclusion == 'failure')
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            blocks:
              - type: section
                text:
                  type: mrkdwn
                  text: "${{ job.status == 'success' && ':white_check_mark:' || ':x:' }} RoboRIO Build *${{ job.status == 'failure' && 'failed' || 'recovered' }}* for `${{ github.repository }}` on `${{ github.ref_name }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>"
